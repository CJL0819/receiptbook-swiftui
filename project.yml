name: ReceiptBook
options:
  bundleIdPrefix: com.receiptbook
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ReceiptBook:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/LaunchScreen.storyboard
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.receiptbook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Entitlements/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.receiptbook
    dependencies:
      - target: ReceiptWidget
        embed: true

  ReceiptWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/LaunchScreen.storyboard
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Widget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.receiptbook.widget
        SWIFT_VERSION: "5.9"
    entitlements:
      path: Entitlements/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.receiptbook

  ReceiptBookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ReceiptBook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.receiptbook.uitests
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: ReceiptBook
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ReceiptBook:
    build:
      targets:
        ReceiptBook: all
        ReceiptWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReceiptBookUITests
